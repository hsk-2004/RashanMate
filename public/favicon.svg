<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#111638"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676"/>
      <stop offset="100%" style="stop-color:#00b0ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Cart body -->
  <g transform="translate(256,260) scale(1.1)">
    <!-- Cart basket -->
    <path d="M-95,10 L-75,-70 L75,-70 L95,10 Z" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart handle -->
    <path d="M-115,-70 L-75,-70" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    <!-- Cart line 1 -->
    <line x1="-55" y1="-40" x2="55" y2="-40" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <!-- Cart line 2 -->
    <line x1="-45" y1="-10" x2="45" y2="-10" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="-50" cy="35" r="18" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <circle cx="50" cy="35" r="18" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <!-- Checkmark badge -->
    <circle cx="85" cy="-80" r="30" fill="#00E676"/>
    <path d="M72,-80 L82,-70 L100,-90" fill="none" stroke="#0a0e27" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
